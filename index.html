<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbikusSudo</title>
    <link rel="stylesheet" href="style.css">
    <link id="favicon" rel="icon" type="image/png" href="D.png">
</head>
<body>
    <nav>
        <a href="#" class="nav-brand">
            <img src="D.png" alt="Logo" class="nav-logo">
            <span>AbikusSudo</span>
        </a>
        <div class="nav-controls">
            <a href="#projects">Projects</a>
            <a href="https://github.com/AbikusSudo" target="_blank">GitHub</a>
            <button class="theme-btn" id="themeBtn">🌓</button>
        </div>
    </nav>

    <section class="hero">
        <h1>Developer Tools</h1>
        <p>Open-source utilities and tools for modern development workflows. Minimal, focused, and practical.</p>
    </section>

    <section class="projects-container" id="projects">
        <div class="projects-header">
            <h2>Projects</h2>
            <input type="text" class="search-box" id="searchInput" placeholder="Search projects...">
        </div>
        
        <div class="projects-grid" id="projectsGrid">
            <div class="loading">
                <div class="loader"></div>
            </div>
        </div>
    </section>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="modalClose">✕</button>
            <div id="modalContent">
                <!-- Modal content will be inserted here -->
            </div>
        </div>
    </div>

    <footer>
        <p>TM 2025 AbikusSudo. Open source software.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
